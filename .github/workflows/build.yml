name: Build et test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib qemu-system-x86

      - name: La documentation du site est a jour
        run: |
          python3 site/gen-docs.py
          git diff --exit-code -- site/docs.html || { echo "relancez python3 site/gen-docs.py et commitez site/docs.html"; exit 1; }

      - name: Test de l'allocateur (hote, 32 bits)
        run: make test-heap

      - name: Fuzz des fonctions de base (hote)
        run: make test-lib test-fs test-sha test-net

      - name: Compilation
        run: make

      - name: Tests dans QEMU (clavier et serie)
        run: python3 tests/qemu_test.py build/lilos.img

      - name: Attaques contre le noyau depuis le mode utilisateur
        run: make test-attack

      - name: Attaque reseau reelle (paquets hostiles envoyes a la VM)
        run: make test-netattack

      - name: Fuzz du shell (touches aleatoires dans QEMU)
        run: make fuzz-shell SEED=7 ROUNDS=40

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: lilos-img
          path: build/lilos.img
