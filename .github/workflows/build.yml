name: Build et test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib qemu-system-x86

      - name: Compilation
        run: make

      - name: Demarrage dans QEMU
        run: |
          timeout 20 qemu-system-i386 \
            -drive format=raw,file=build/lilos.img \
            -display none -serial file:serial.log -no-reboot || true
          cat serial.log
          grep -q "LilOS pret" serial.log
          ! grep -q "PANIC\|EXCEPTION" serial.log

      - uses: actions/upload-artifact@v4
        with:
          name: lilos-img
          path: build/lilos.img
