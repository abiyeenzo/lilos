name: Release

# Publie une version signée : image, somme de contrôle, signature Ed25519 et
# attestation de provenance. Se déclenche en poussant un tag vX.Y.Z (ou à la main).
# L'environnement "release" exige l'approbation du mainteneur avant d'accéder
# à la clé de signature.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à publier (ex : v0.3.0)"
        required: true
        type: string
      publish:
        description: "Publier (sinon : brouillon visible des mainteneurs seulement)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Contrôles avant publication
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$' || { echo "tag invalide : $TAG"; exit 1; }

          version="$(sed -n 's/^#define LILOS_VERSION "\(.*\)"/\1/p' kernel/lilos.h)"
          [ "v$version" = "${TAG%%-*}" ] || { echo "le tag $TAG ne correspond pas à LILOS_VERSION ($version)"; exit 1; }

          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main || { echo "le commit n'est pas sur main"; exit 1; }

          sha="$(git rev-parse HEAD)"
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$sha&status=completed" --jq '[.workflow_runs[].conclusion] | map(select(. == "success")) | length')"
          [ "$state" -ge 1 ] || { echo "la CI n'est pas verte pour $sha : release refusée"; exit 1; }

          ! gh release view "$TAG" >/dev/null 2>&1 || { echo "la release $TAG existe déjà"; exit 1; }

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib

      - name: Compilation et tests rapides
        run: |
          make
          make test-heap test-lib test-fs test-sha test-net

      - name: Signature
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          mkdir dist
          cp build/lilos.img dist/lilos.img
          cp release/lilos-release.pub.pem dist/

          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/lilos.img -out dist/lilos.img.sig
          shred -u "$key"

          # la signature doit se vérifier avec la clé publique du dépôt
          openssl pkeyutl -verify -pubin -inkey release/lilos-release.pub.pem \
            -rawin -in dist/lilos.img -sigfile dist/lilos.img.sig
          (cd dist && sha256sum lilos.img lilos.img.sig lilos-release.pub.pem > SHA256SUMS)

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/lilos.img

      - name: Publication
        run: |
          set -eu
          sums="$(cat dist/SHA256SUMS)"
          cat > notes.md <<EOF
          ## LilOS ${TAG}

          Image disque brute pour QEMU ou une machine en mode BIOS.

          \`\`\`
          qemu-system-i386 -drive format=raw,file=lilos.img -nic user,model=rtl8139
          \`\`\`

          ### Vérifier le téléchargement

          \`\`\`
          sha256sum -c SHA256SUMS
          openssl pkeyutl -verify -pubin -inkey lilos-release.pub.pem -rawin -in lilos.img -sigfile lilos.img.sig
          gh attestation verify lilos.img --repo ${GITHUB_REPOSITORY}
          \`\`\`

          Empreintes :

          \`\`\`
          ${sums}
          \`\`\`
          EOF
          sed -i 's/^          //' notes.md

          flags=""
          [ "$PUBLISH" = "true" ] || flags="--draft"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" dist/* --title "LilOS $TAG" --notes-file notes.md --generate-notes --verify-tag $flags
