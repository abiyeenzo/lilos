name: Site

# Construit le site (avec la démo dans le navigateur) et le publie sur GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release/**'
      - 'kernel/**'
      - 'user/**'
      - 'bootloader/**'
      - 'Makefile'
      - 'linker.ld'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib

      - name: Compiler l'image pour la démo
        run: make

      - name: Assembler le site
        run: sh site/build.sh _site --image build/lilos.img

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
