name: Site

# Construit le site (avec la démo dans le navigateur) et le publie sur GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release/**'
      - 'kernel/**'
      - 'user/**'
      - 'bootloader/**'
      - 'Makefile'
      - 'linker.ld'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib

      - name: Compiler l'image pour la démo
        run: make

      - name: Assembler le site
        run: sh site/build.sh _site --image build/lilos.img

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
